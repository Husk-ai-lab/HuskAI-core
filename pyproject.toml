[project]
name = "husk"
version = "0.1.1"
description = "Husk AI — automation discovery and automations for Italian manufacturing SMEs (MVP)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "BUSL-1.1" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "keyring>=25",
    "platformdirs>=4.2",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "markitdown[pdf,docx,xlsx,pptx]>=0.1.2",
    "bm25s>=0.2.6",
    "PyStemmer>=2.2",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "langchain-core>=0.3.30",
    "langchain-openai>=0.3",
    "langchain-mcp-adapters>=0.1",
    "mcp>=1.9",
    "apscheduler>=3.10,<4",
    "watchfiles>=0.24",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "openinference-instrumentation-langchain>=0.1.29",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "pyinstaller>=6.10",
    "matplotlib>=3.9",
    "python-docx>=1.1",
]

[project.scripts]
husk = "app.main:run"

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.uv]
package = false
# cryptography 49+ publishes no macOS x86_64 wheel, so an Intel Mac would compile it against a different
# OpenSSL than the one PyInstaller bundles (the binary then dies at start-up). 48.x is the last release
# with a self-contained universal2 wheel. Other platforms keep the newest version.
constraint-dependencies = ["cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'"]
